<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ali & Aisha | Wedding Invitation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Kufi+Arabic:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 30%,#fff 0%,#faf7f1 45%,#eee8dc 100%);
  overflow:hidden;
  color:#8b7040;
  font-family:"Noto Kufi Arabic",sans-serif;
}

/* شاشة البداية */
.opening{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#fffdf9,#eee8dc);
  transition:1.5s ease;
}

.opening.hide{
  opacity:0;
  pointer-events:none;
}

.envelope{
  position:relative;
  width:min(85vw,430px);
  height:280px;
  perspective:1000px;
  filter:drop-shadow(0 25px 35px rgba(90,70,30,.18));
}

/* الظرف */
.env-body{
  position:absolute;
  inset:0;
  background:linear-gradient(145deg,#fff,#f3eee5);
  border:1px solid #d4b66b;
  border-radius:5px;
  overflow:hidden;
}

/* مثلثات الظرف */
.env-body:before,
.env-body:after{
  content:"";
  position:absolute;
  bottom:0;
  width:0;
  height:0;
  border-style:solid;
  z-index:3;
}

.env-body:before{
  left:0;
  border-width:140px 215px 0 0;
  border-color:#eee7da transparent transparent transparent;
}

.env-body:after{
  right:0;
  border-width:140px 0 0 215px;
  border-color:#e7dfd0 transparent transparent transparent;
}

/* الغطاء */
.flap{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:155px;
  background:linear-gradient(160deg,#fffdf9,#e9e0d0);
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top center;
  z-index:8;
  transition:1.5s cubic-bezier(.65,.05,.36,1);
  border-top:1px solid #d4b66b;
}

.envelope.open .flap{
  transform:rotateX(180deg);
}

/* الختم */
.seal{
  position:absolute;
  z-index:12;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:72px;
  height:72px;
  border-radius:50%;
  background:linear-gradient(145deg,#e5c777,#a98435);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Cormorant Garamond",serif;
  font-size:26px;
  letter-spacing:2px;
  box-shadow:0 5px 15px rgba(110,80,20,.3);
  transition:1s ease;
}

.envelope.open .seal{
  opacity:0;
  transform:translate(-50%,-50%) scale(.4);
}

/* البطاقة */
.card{
  position:absolute;
  left:50%;
  top:50%;
  width:min(86vw,390px);
  min-height:500px;
  transform:translate(-50%,100%);
  background:rgba(255,253,249,.97);
  border:1px solid #d7bd7b;
  box-shadow:0 25px 70px rgba(83,63,28,.18);
  border-radius:4px;
  padding:48px 28px;
  text-align:center;
  opacity:0;
  transition:1.7s cubic-bezier(.2,.8,.2,1);
  z-index:5;
}

.card.show{
  transform:translate(-50%,-50%);
  opacity:1;
}

.ornament{
  font-size:28px;
  color:#bd9747;
  margin-bottom:15px;
}

.small{
  font-size:11px;
  letter-spacing:4px;
  color:#a58b5a;
}

.names{
  font-family:"Cormorant Garamond",serif;
  font-size:58px;
  line-height:1;
  margin:18px 0;
  color:#8c6d35;
  direction:ltr;
}

.and{
  font-size:24px;
  color:#c7a85f;
  margin:8px;
}

.line{
  width:80px;
  height:1px;
  background:#c8aa67;
  margin:20px auto;
}

.text{
  font-size:13px;
  line-height:2.2;
  color:#79694d;
}

.date{
  font-family:"Cormorant Garamond",serif;
  font-size:27px;
  direction:ltr;
  margin:15px 0 5px;
  color:#896c39;
}

.location{
  margin-top:15px;
  font-size:13px;
}

.countdown{
  display:flex;
  justify-content:center;
  gap:9px;
  margin-top:22px;
  direction:ltr;
}

.box{
  min-width:55px;
  padding:8px 5px;
  border:1px solid #d8bf83;
  background:#fffdf8;
}

.box b{
  display:block;
  font-family:"Cormorant Garamond",serif;
  font-size:22px;
  font-weight:500;
}

.box span{
  font-size:8px;
  color:#a18b63;
}

/* زر الصوت */
.sound{
  position:fixed;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  z-index:30;
  border:1px solid #c9aa63;
  background:rgba(255,255,255,.9);
  color:#8d703c;
  padding:9px 20px;
  border-radius:30px;
  font-family:inherit;
  cursor:pointer;
}

/* ورود */
.flower{
  position:fixed;
  color:#d2bb82;
  opacity:.3;
  font-size:45px;
  animation:float 8s infinite ease-in-out;
}

.f1{top:7%;left:5%}
.f2{bottom:8%;right:5%;animation-delay:2s}
.f3{top:20%;right:8%;font-size:30px;animation-delay:4s}

@keyframes float{
  0%,100%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(-18px) rotate(8deg)}
}

.tap{
  position:absolute;
  bottom:25px;
  width:100%;
  text-align:center;
  font-size:11px;
  letter-spacing:2px;
  color:#9d8350;
  z-index:15;
}
</style>
</head>

<body>

<div class="flower f1">✿</div>
<div class="flower f2">❀</div>
<div class="flower f3">✧</div>

<!-- الظرف -->
<div class="opening" id="opening">

  <div class="envelope" id="envelope">

    <div class="env-body"></div>

    <div class="flap"></div>

    <div class="seal">A&nbsp;&amp;&nbsp;A</div>

    <div class="tap">
      اضغط لفتح الدعوة
    </div>

  </div>

</div>

<!-- البطاقة -->
<div class="card" id="card">

  <div class="ornament">❦</div>

  <div class="small">
    WEDDING INVITATION
  </div>

  <div class="names">
    Ali
    <div class="and">&amp;</div>
    Aisha
  </div>

  <div class="line"></div>

  <div class="text">
    بكل حب وفرح، نتشرف بدعوتكم<br>
    لمشاركتنا أجمل لحظات العمر
  </div>

  <div class="date">
    02 · 12 · 2026
  </div>

  <div class="text">
    Wednesday · 5:00 PM
  </div>

  <div class="location">
    قاعة كلكامش<br>
    فندق بابل
  </div>

  <div class="line"></div>

  <div class="small">
    جَنّةُ الأطفالِ منازلُهم
  </div>

  <div class="countdown">
    <div class="box">
      <b id="days">00</b>
      <span>DAYS</span>
    </div>

    <div class="box">
      <b id="hours">00</b>
      <span>HOURS</span>
    </div>

    <div class="box">
      <b id="minutes">00</b>
      <span>MINUTES</span>
    </div>

    <div class="box">
      <b id="seconds">00</b>
      <span>SECONDS</span>
    </div>
  </div>

</div>

<audio id="music" loop>
  <source src="swan-dance.mp3" type="audio/mpeg">
</audio>

<button class="sound" id="sound">♫ تشغيل الموسيقى</button>

<script>

const envelope = document.getElementById("envelope");
const opening = document.getElementById("opening");
const card = document.getElementById("card");
const music = document.getElementById("music");

let opened = false;

opening.addEventListener("click", () => {

  if(opened) return;
  opened = true;

  envelope.classList.add("open");

  setTimeout(() => {
    card.classList.add("show");
  },900);

  setTimeout(() => {
    opening.classList.add("hide");
  },2300);

  music.play().catch(()=>{});

});

document.getElementById("sound").addEventListener("click", () => {

  if(music.paused){
    music.play();
    document.getElementById("sound").innerText="♫ إيقاف الموسيقى";
  }else{
    music.pause();
    document.getElementById("sound").innerText="♫ تشغيل الموسيقى";
  }

});

function countdown(){

  const wedding = new Date("December 2, 2026 17:00:00").getTime();
  const now = new Date().getTime();

  let distance = wedding - now;

  if(distance < 0) distance = 0;

  const days = Math.floor(distance/(1000*60*60*24));
  const hours = Math.floor((distance%(1000*60*60*24))/(1000*60*60));
  const minutes = Math.floor((distance%(1000*60*60))/(1000*60));
  const seconds = Math.floor((distance%(1000*60))/1000);

  document.getElementById("days").innerText=String(days).padStart(2,"0");
  document.getElementById("hours").innerText=String(hours).padStart(2,"0");
  document.getElementById("minutes").innerText=String(minutes).padStart(2,"0");
  document.getElementById("seconds").innerText=String(seconds).padStart(2,"0");
}

countdown();
setInterval(countdown,1000);

</script>

</body>
</html>
