<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ali & Aisha | Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f5eee7;
    overflow:hidden;
    font-family:'Noto Naskh Arabic',serif;
}

/* =========================
   INTRO
========================= */

.intro{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at center,#fffdf9 0%,#f4e9df 55%,#e8d8ca 100%);
    transition:1.8s ease;
}

.intro.hide{
    opacity:0;
    pointer-events:none;
}

.envelope{
    position:relative;
    width:330px;
    height:230px;
    cursor:pointer;
    perspective:1000px;
}

.envelope-body{
    position:absolute;
    inset:0;
    background:linear-gradient(145deg,#fffdf9,#eee0d3);
    border-radius:5px;
    box-shadow:
        0 30px 80px rgba(90,65,45,.22),
        inset 0 0 0 1px rgba(175,135,90,.35);
    overflow:hidden;
}

.envelope-body:after{
    content:"";
    position:absolute;
    inset:12px;
    border:1px solid rgba(170,125,70,.4);
}

.flap{
    position:absolute;
    z-index:5;
    top:0;
    left:0;
    width:0;
    height:0;
    border-left:165px solid transparent;
    border-right:165px solid transparent;
    border-top:125px solid #e8d6c6;
    transform-origin:top;
    transition:1.5s cubic-bezier(.2,.8,.2,1);
    filter:drop-shadow(0 5px 4px rgba(0,0,0,.12));
}

.envelope.open .flap{
    transform:rotateX(180deg);
}

.seal{
    position:absolute;
    z-index:8;
    left:50%;
    top:53%;
    transform:translate(-50%,-50%);
    width:68px;
    height:68px;
    border-radius:50%;
    background:linear-gradient(145deg,#d8b77b,#a98243);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-family:'Cormorant Garamond',serif;
    font-size:25px;
    box-shadow:0 10px 30px rgba(110,75,35,.3);
    transition:.8s;
}

.envelope.open .seal{
    opacity:0;
    transform:translate(-50%,-50%) scale(.3);
}

.open-text{
    position:absolute;
    top:calc(50% + 150px);
    left:50%;
    transform:translateX(-50%);
    color:#9c7745;
    font-family:'Cormorant Garamond',serif;
    font-size:17px;
    letter-spacing:3px;
    white-space:nowrap;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    50%{opacity:.45}
}

/* =========================
   INVITATION
========================= */

.invitation{
    position:fixed;
    inset:0;
    overflow-y:auto;
    overflow-x:hidden;
    opacity:0;
    transform:scale(1.08);
    transition:2s cubic-bezier(.2,.8,.2,1);
    background:#f8f0e9;
}

.invitation.show{
    opacity:1;
    transform:scale(1);
}

.hero{
    position:relative;
    width:100%;
    min-height:100vh;
    overflow:hidden;
}

.hero-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    animation:slowZoom 14s ease-in-out infinite alternate;
    filter:saturate(.88) contrast(.96);
}

@keyframes slowZoom{
    from{transform:scale(1)}
    to{transform:scale(1.055)}
}

/* soft cinematic overlay */

.overlay{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            to bottom,
            rgba(255,249,242,.25),
            rgba(255,249,242,.05) 45%,
            rgba(45,30,20,.32) 100%
        );
}

/* =========================
   GOLD SPARKLES
========================= */

.sparkles{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.spark{
    position:absolute;
    width:4px;
    height:4px;
    background:#fff6d9;
    border-radius:50%;
    box-shadow:0 0 12px #fff;
    animation:float 5s infinite ease-in-out;
}

.spark:nth-child(1){left:12%;top:28%;animation-delay:0s}
.spark:nth-child(2){left:25%;top:18%;animation-delay:1s}
.spark:nth-child(3){left:76%;top:24%;animation-delay:2s}
.spark:nth-child(4){left:88%;top:40%;animation-delay:3s}
.spark:nth-child(5){left:18%;top:55%;animation-delay:1.5s}
.spark:nth-child(6){left:70%;top:60%;animation-delay:2.5s}
.spark:nth-child(7){left:50%;top:35%;animation-delay:.5s}

@keyframes float{
    0%,100%{
        opacity:.15;
        transform:translateY(0) scale(.7);
    }
    50%{
        opacity:1;
        transform:translateY(-18px) scale(1.5);
    }
}

/* =========================
   CONTENT
========================= */

.content{
    position:relative;
    z-index:3;
    min-height:100vh;
    padding:70px 22px 60px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    color:white;
}

.small-title{
    margin-top:5px;
    font-family:'Cormorant Garamond',serif;
    font-size:20px;
    letter-spacing:6px;
    text-transform:uppercase;
    opacity:0;
    animation:appear 1.5s 2s forwards;
}

.names{
    margin-top:18px;
    font-family:'Playfair Display',serif;
    font-size:clamp(48px,13vw,82px);
    font-weight:500;
    line-height:.95;
    letter-spacing:3px;
    text-shadow:0 4px 25px rgba(0,0,0,.22);
    opacity:0;
    animation:namesIn 2s 2.5s forwards;
}

.amp{
    display:block;
    font-family:'Cormorant Garamond',serif;
    font-size:35px;
    margin:10px 0;
    color:#f4d99d;
}

.divider{
    width:100px;
    height:1px;
    margin:25px auto;
    background:linear-gradient(
        to right,
        transparent,
        #f1d49a,
        transparent
    );
    opacity:0;
    animation:appear 1.5s 3.2s forwards;
}

.invite-text{
    font-size:18px;
    line-height:2;
    text-shadow:0 2px 12px rgba(0,0,0,.4);
    opacity:0;
    animation:appear 1.5s 3.5s forwards;
}

.date{
    margin-top:25px;
    font-family:'Cormorant Garamond',serif;
    font-size:27px;
    letter-spacing:2px;
    opacity:0;
    animation:appear 1.5s 3.8s forwards;
}

.time{
    margin-top:5px;
    font-family:'Cormorant Garamond',serif;
    font-size:22px;
    letter-spacing:3px;
    opacity:0;
    animation:appear 1.5s 4s forwards;
}

.location{
    margin-top:15px;
    font-size:17px;
    opacity:0;
    animation:appear 1.5s 4.2s forwards;
}

/* =========================
   DETAILS CARD
========================= */

.details{
    margin-top:35px;
    padding:18px 30px;
    border:1px solid rgba(255,225,175,.65);
    background:rgba(65,45,30,.18);
    backdrop-filter:blur(5px);
    box-shadow:0 15px 40px rgba(0,0,0,.15);
    opacity:0;
    animation:appear 1.5s 4.5s forwards;
}

.details-title{
    font-family:'Cormorant Garamond',serif;
    font-size:17px;
    letter-spacing:2px;
    color:#f6dba4;
    margin-bottom:8px;
}

.details-text{
    font-size:16px;
}

/* =========================
   CHILDREN NOTE
========================= */

.children{
    margin-top:30px;
    font-size:16px;
    color:#fff8ee;
    opacity:0;
    animation:appear 1.5s 5s forwards;
}

.children span{
    display:block;
    margin-top:5px;
    font-family:'Cormorant Garamond',serif;
    font-size:18px;
    color:#f4d69c;
}

/* =========================
   BUTTON
========================= */

.location-btn{
    margin-top:25px;
    padding:12px 28px;
    border:1px solid rgba(255,220,170,.8);
    border-radius:30px;
    background:rgba(255,255,255,.12);
    color:white;
    text-decoration:none;
    font-family:'Cormorant Garamond',serif;
    letter-spacing:2px;
    backdrop-filter:blur(6px);
    transition:.4s;
    opacity:0;
    animation:appear 1.5s 5.3s forwards;
}

.location-btn:hover{
    background:rgba(255,255,255,.25);
    transform:translateY(-3px);
}

/* =========================
   ANIMATIONS
========================= */

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes namesIn{
    from{
        opacity:0;
        transform:scale(.85) translateY(25px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .envelope{
        width:290px;
        height:205px;
    }

    .flap{
        border-left-width:145px;
        border-right-width:145px;
        border-top-width:110px;
    }

    .content{
        padding-top:55px;
    }

    .small-title{
        font-size:17px;
        letter-spacing:4px;
    }

    .names{
        font-size:55px;
    }

    .invite-text{
        font-size:16px;
    }

    .hero-image{
        object-position:center center;
    }
}
</style>
</head>

<body>

<!-- =========================
     ENVELOPE
========================= -->

<section class="intro" id="intro">

    <div class="envelope" id="envelope">

        <div class="envelope-body"></div>

        <div class="flap"></div>

        <div class="seal">
            A&A
        </div>

    </div>

    <div class="open-text">
        OPEN INVITATION
    </div>

</section>


<!-- =========================
     INVITATION
========================= -->

<main class="invitation" id="invitation">

<section class="hero">

    <!-- صورت العرسان -->
    <img src="wedding.jpg" class="hero-image">

    <div class="overlay"></div>

    <!-- اللمعات -->
    <div class="sparkles">
        <i class="spark"></i>
        <i class="spark"></i>
        <i class="spark"></i>
        <i class="spark"></i>
        <i class="spark"></i>
        <i class="spark"></i>
        <i class="spark"></i>
    </div>


    <div class="content">

        <div class="small-title">
            WEDDING INVITATION
        </div>


        <div class="names">

            Ali

            <span class="amp">&</span>

            Aisha

        </div>


        <div class="divider"></div>


        <div class="invite-text">
            بكل حب وفرح<br>
            نتشرف بدعوتكم لمشاركتنا أجمل لحظات العمر
        </div>


        <div class="date">
            2 December 2026
        </div>


        <div class="time">
            5:00 PM
        </div>


        <div class="location">
            قاعة كلكامش فندي بابل
        </div>


        <div class="details">

            <div class="details-title">
                OUR SPECIAL DAY
            </div>

            <div class="details-text">
                حضوركم يزيد فرحتنا جمالاً
            </div>

        </div>


        <div class="children">

            بكل محبة وامتنان

            <span>
                جَنّةُ الأطفالِ منازلُهم
            </span>

        </div>


        <a
            class="location-btn"
            href="https://www.google.com/maps/search/?api=1&query=فندق+بابل+العراق"
            target="_blank">
            VIEW LOCATION
        </a>

    </div>

</section>

</main>


<script>

const envelope = document.getElementById("envelope");
const intro = document.getElementById("intro");
const invitation = document.getElementById("invitation");

envelope.addEventListener("click", () => {

    envelope.classList.add("open");

    setTimeout(() => {

        intro.classList.add("hide");

        invitation.classList.add("show");

        document.body.style.overflow = "auto";

    }, 1500);

});

</script>

</body>
</html>
