<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALI & AISHA — Wedding Invitation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&family=Noto+Kufi+Arabic:wght@300;400&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --gold:#c8a45d;
    --gold2:#f1d99b;
    --cream:#fffdf8;
    --dark:#17130d;
}

body{
    width:100%;
    min-height:100vh;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 35%,#fff 0%,#faf6ed 38%,#e9dfcd 100%);
    color:#8b6b35;
}

/* =========================
   النجوم
========================= */

.sparkle{
    position:fixed;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#d7b86d;
    box-shadow:0 0 12px #e9d18e;
    animation:twinkle 3s infinite ease-in-out;
    opacity:.7;
}

.s1{top:12%;left:18%;animation-delay:.2s}
.s2{top:25%;right:15%;animation-delay:1s}
.s3{bottom:18%;left:12%;animation-delay:1.8s}
.s4{bottom:28%;right:20%;animation-delay:.7s}
.s5{top:42%;left:8%;animation-delay:2.2s}
.s6{top:58%;right:7%;animation-delay:1.3s}

@keyframes twinkle{
    0%,100%{transform:scale(.5);opacity:.2}
    50%{transform:scale(2);opacity:1}
}

/* =========================
   شاشة الظرف
========================= */

.opening{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at center,#fffefa,#f4ecde 75%);
    transition:1.8s ease;
}

.opening.hide{
    opacity:0;
    pointer-events:none;
}

/* =========================
   الظرف
========================= */

.envelope{
    position:relative;
    width:min(88vw,520px);
    height:340px;
    perspective:1600px;
    filter:
      drop-shadow(0 35px 45px rgba(70,50,20,.23));
}

.env-back{
    position:absolute;
    inset:0;
    border-radius:7px;
    background:
      linear-gradient(145deg,#fffefa,#eee5d5);
    border:1px solid rgba(190,150,70,.6);
    box-shadow:
      inset 0 0 30px rgba(160,120,50,.08);
}

/* بطاقة داخل الظرف */

.inner-card{
    position:absolute;
    width:86%;
    height:82%;
    left:7%;
    top:9%;
    background:#fffdf8;
    border:1px solid #d4b46b;
    box-shadow:0 12px 35px rgba(70,50,20,.15);
    z-index:3;
    transition:
      transform 1.8s cubic-bezier(.2,.8,.2,1),
      opacity 1s;
    transform:translateY(15px);
}

.inner-card:before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(198,161,88,.4);
}

/* مثلثات الظرف */

.left-fold,
.right-fold,
.bottom-fold{
    position:absolute;
    z-index:5;
}

.left-fold{
    left:0;
    bottom:0;
    width:0;
    height:0;
    border-style:solid;
    border-width:170px 260px 0 0;
    border-color:#f0e8db transparent transparent transparent;
}

.right-fold{
    right:0;
    bottom:0;
    width:0;
    height:0;
    border-style:solid;
    border-width:170px 0 0 260px;
    border-color:#e8decd transparent transparent transparent;
}

.bottom-fold{
    left:0;
    bottom:0;
    width:100%;
    height:55%;
    background:linear-gradient(160deg,#faf5eb,#e9dfcf);
    clip-path:polygon(0 100%,50% 0,100% 100%);
    z-index:7;
}

/* الغطاء العلوي */

.flap{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:190px;
    background:
      linear-gradient(160deg,#fffefa,#e9dfcf);
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top center;
    transition:
      transform 1.8s cubic-bezier(.65,.05,.36,1);
    z-index:10;
    border-top:1px solid rgba(190,150,70,.5);
}

/* فتح الظرف */

.envelope.open .flap{
    transform:rotateX(180deg);
}

.envelope.open .inner-card{
    transform:translateY(-115px);
}

/* =========================
   الختم
========================= */

.seal{
    position:absolute;
    width:86px;
    height:86px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:20;

    border-radius:50%;

    background:
      radial-gradient(circle at 30% 25%,
      #f6df9a,
      #c69d4c 48%,
      #8d692c 100%);

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:"Cormorant Garamond",serif;
    font-size:27px;
    letter-spacing:2px;

    box-shadow:
      0 7px 18px rgba(100,70,20,.35),
      inset 0 0 0 2px rgba(255,255,255,.35);

    transition:
      opacity .8s,
      transform 1s;
}

.seal:after{
    content:"";
    position:absolute;
    inset:-8px;
    border-radius:50%;
    border:1px solid rgba(192,153,70,.6);
}

.envelope.open .seal{
    opacity:0;
    transform:translate(-50%,-50%) scale(.3) rotate(20deg);
}

/* =========================
   النص على الظرف
========================= */

.envelope-label{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    z-index:30;
    color:#92713b;
    font-family:"Cormorant Garamond",serif;
    font-size:13px;
    letter-spacing:5px;
}

/* =========================
   بطاقة الدعوة
========================= */

.invitation{
    position:fixed;
    left:50%;
    top:50%;

    width:min(91vw,470px);
    min-height:650px;

    transform:
      translate(-50%,100%)
      scale(.92);

    opacity:0;

    background:
      linear-gradient(
        145deg,
        rgba(255,255,252,.99),
        rgba(250,246,237,.99)
      );

    border:1px solid #c9a55f;

    box-shadow:
      0 35px 100px rgba(70,50,20,.25),
      inset 0 0 0 7px rgba(210,181,119,.08);

    transition:
      transform 2s cubic-bezier(.16,1,.3,1),
      opacity 1.5s;

    z-index:50;

    text-align:center;
    padding:55px 30px 40px;

    overflow:hidden;
}

.invitation.show{
    transform:
      translate(-50%,-50%)
      scale(1);
    opacity:1;
}

/* إطار داخلي */

.invitation:before{
    content:"";
    position:absolute;
    inset:15px;
    border:1px solid rgba(196,157,81,.55);
    pointer-events:none;
}

.invitation:after{
    content:"";
    position:absolute;
    inset:22px;
    border:1px solid rgba(196,157,81,.18);
    pointer-events:none;
}

/* الزخرفة */

.crown{
    font-size:31px;
    color:#b58d43;
    margin-bottom:10px;
}

.subtitle{
    font-family:"Cormorant Garamond",serif;
    letter-spacing:7px;
    font-size:13px;
    color:#9c7d46;
}

.names{
    direction:ltr;
    font-family:"Playfair Display","Cormorant Garamond",serif;
    font-size:64px;
    line-height:.95;
    color:#8a6934;
    margin:25px 0 12px;
    font-weight:400;
}

.names span{
    display:block;
}

.amp{
    font-family:"Cormorant Garamond",serif;
    font-size:28px;
    color:#c29a4e;
    margin:10px 0;
}

.gold-line{
    width:100px;
    height:1px;
    background:linear-gradient(
      90deg,
      transparent,
      #c8a45d,
      transparent
    );
    margin:22px auto;
}

.arabic{
    font-family:"Noto Kufi Arabic",sans-serif;
    font-size:12px;
    line-height:2.3;
    color:#78684c;
}

.date{
    direction:ltr;
    font-family:"Cormorant Garamond",serif;
    font-size:31px;
    letter-spacing:4px;
    color:#876733;
    margin:15px 0 4px;
}

.time{
    font-family:"Cormorant Garamond",serif;
    font-size:17px;
    letter-spacing:2px;
    color:#9d8050;
}

.location{
    margin-top:18px;
    font-family:"Noto Kufi Arabic",sans-serif;
    font-size:12px;
    line-height:2;
    color:#75654a;
}

/* ممنوع الأطفال */

.children{
    margin-top:20px;
    font-family:"Noto Kufi Arabic",sans-serif;
    font-size:11px;
    color:#947745;
    letter-spacing:.3px;
}

/* العد التنازلي */

.countdown{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:24px;
    direction:ltr;
}

.timebox{
    width:60px;
    padding:8px 3px;
    border:1px solid rgba(194,157,84,.55);
    background:rgba(255,255,255,.55);
}

.timebox strong{
    display:block;
    font-family:"Cormorant Garamond",serif;
    font-size:24px;
    color:#896b38;
    font-weight:500;
}

.timebox small{
    font-family:"Cormorant Garamond",serif;
    font-size:8px;
    letter-spacing:1px;
    color:#a18a62;
}

/* =========================
   الورود
========================= */

.flower{
    position:fixed;
    z-index:2;
    color:#c5a76c;
    opacity:.25;
    font-size:50px;
    animation:float 9s ease-in-out infinite;
}

.f1{top:4%;left:4%}
.f2{bottom:4%;right:3%;animation-delay:2s}
.f3{top:17%;right:5%;font-size:35px;animation-delay:4s}
.f4{bottom:20%;left:4%;font-size:30px;animation-delay:6s}

@keyframes float{
    0%,100%{
        transform:translateY(0) rotate(0deg);
    }
    50%{
        transform:translateY(-25px) rotate(8deg);
    }
}

/* =========================
   زر الموسيقى
========================= */

.music{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:200;

    border:1px solid #c5a15b;
    background:rgba(255,253,248,.92);

    color:#866a39;

    padding:9px 22px;
    border-radius:30px;

    font-family:"Noto Kufi Arabic",sans-serif;
    font-size:11px;

    box-shadow:0 5px 20px rgba(80,60,20,.1);
}

/* =========================
   الجملة قبل الفتح
========================= */

.open-text{
    position:absolute;
    bottom:-65px;
    width:100%;
    text-align:center;

    font-family:"Cormorant Garamond",serif;
    font-size:14px;
    letter-spacing:4px;

    color:#947441;
}
</style>
</head>

<body>

<!-- نجوم -->
<div class="sparkle s1"></div>
<div class="sparkle s2"></div>
<div class="sparkle s3"></div>
<div class="sparkle s4"></div>
<div class="sparkle s5"></div>
<div class="sparkle s6"></div>

<!-- ورود -->
<div class="flower f1">❀</div>
<div class="flower f2">✿</div>
<div class="flower f3">❁</div>
<div class="flower f4">✧</div>

<!-- =====================
     الظرف
===================== -->

<div class="opening" id="opening">

    <div class="envelope" id="envelope">

        <div class="env-back"></div>

        <div class="inner-card"></div>

        <div class="left-fold"></div>
        <div class="right-fold"></div>
        <div class="bottom-fold"></div>

        <div class="flap"></div>

        <div class="seal">
            A&nbsp;&amp;&nbsp;A
        </div>

        <div class="envelope-label">
            WITH LOVE
        </div>

        <div class="open-text">
            اضغط لفتح الدعوة
        </div>

    </div>

</div>


<!-- =====================
     الدعوة
===================== -->

<div class="invitation" id="invitation">

    <div class="crown">♕</div>

    <div class="subtitle">
        WEDDING INVITATION
    </div>

    <div class="names">

        <span>ALI</span>

        <div class="amp">&amp;</div>

        <span>AISHA</span>

    </div>

    <div class="gold-line"></div>

    <div class="arabic">
        بكل حب وفرح<br>
        نتشرف بدعوتكم لمشاركتنا<br>
        أجمل لحظات العمر
    </div>

    <div class="date">
        02 · 12 · 2026
    </div>

    <div class="time">
        5:00 PM
    </div>

    <div class="location">
        قاعة كلكامش<br>
        فندق بابل
    </div>

    <div class="gold-line"></div>

    <div class="children">
        جَنّةُ الأطفالِ مَنازِلُهم
    </div>

    <div class="countdown">

        <div class="timebox">
            <strong id="days">00</strong>
            <small>DAYS</small>
        </div>

        <div class="timebox">
            <strong id="hours">00</strong>
            <small>HOURS</small>
        </div>

        <div class="timebox">
            <strong id="minutes">00</strong>
            <small>MINUTES</small>
        </div>

        <div class="timebox">
            <strong id="seconds">00</strong>
            <small>SECONDS</small>
        </div>

    </div>

</div>


<!-- الموسيقى -->
<audio id="music" loop>
    <source src="swan-dance.mp3" type="audio/mpeg">
</audio>

<button class="music" id="musicBtn">
    ♫ تشغيل الموسيقى
</button>


<script>

const opening = document.getElementById("opening");
const envelope = document.getElementById("envelope");
const invitation = document.getElementById("invitation");
const music = document.getElementById("music");
const musicBtn = document.getElementById("musicBtn");

let opened = false;

/* فتح الظرف */

opening.addEventListener("click",function(){

    if(opened) return;

    opened = true;

    envelope.classList.add("open");

    music.play().catch(()=>{});

    setTimeout(()=>{
        invitation.classList.add("show");
    },1100);

    setTimeout(()=>{
        opening.classList.add("hide");
    },2800);

});


/* الموسيقى */

musicBtn.addEventListener("click",function(){

    if(music.paused){

        music.play();

        musicBtn.innerHTML="♫ إيقاف الموسيقى";

    }else{

        music.pause();

        musicBtn.innerHTML="♫ تشغيل الموسيقى";

    }

});


/* العد التنازلي */

function countdown(){

    const wedding =
      new Date("December 2, 2026 17:00:00").getTime();

    const now =
      new Date().getTime();

    let distance = wedding-now;

    if(distance < 0){
        distance=0;
    }

    const days =
      Math.floor(distance/(1000*60*60*24));

    const hours =
      Math.floor(
        (distance%(1000*60*60*24))
        /(1000*60*60)
      );

    const minutes =
      Math.floor(
        (distance%(1000*60*60))
        /(1000*60)
      );

    const seconds =
      Math.floor(
        (distance%(1000*60))
        /1000
      );

    document.getElementById("days").textContent =
      String(days).padStart(2,"0");

    document.getElementById("hours").textContent =
      String(hours).padStart(2,"0");

    document.getElementById("minutes").textContent =
      String(minutes).padStart(2,"0");

    document.getElementById("seconds").textContent =
      String(seconds).padStart(2,"0");
}

countdown();

setInterval(countdown,1000);

</script>

</body>
</html>
