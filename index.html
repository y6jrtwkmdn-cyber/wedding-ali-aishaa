<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALI & AISHA | Wedding Invitation</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap');

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  overflow:hidden;
  min-height:100vh;
  background:
    radial-gradient(circle at center,#ffffff 0%,#faf6ed 45%,#e8decd 100%);
  color:#8b6b38;
}

/* النجوم */

.star{
  position:fixed;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#d7b66b;
  box-shadow:0 0 12px #e8cd8d;
  animation:twinkle 3s infinite;
}

.star:nth-child(1){top:12%;left:15%}
.star:nth-child(2){top:22%;right:17%;animation-delay:1s}
.star:nth-child(3){bottom:20%;left:12%;animation-delay:2s}
.star:nth-child(4){bottom:30%;right:10%;animation-delay:.5s}

@keyframes twinkle{
  0%,100%{opacity:.2;transform:scale(.5)}
  50%{opacity:1;transform:scale(2)}
}

/* شاشة الظرف */

.opening{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle,#fffdf9,#eee5d5);
  transition:1.8s;
}

.opening.hide{
  opacity:0;
  pointer-events:none;
}

/* الظرف */

.envelope{
  position:relative;
  width:min(88vw,520px);
  height:340px;
  perspective:1600px;
  filter:drop-shadow(0 30px 40px rgba(70,50,20,.25));
}

.env{
  position:absolute;
  inset:0;
  border:1px solid #c9a45d;
  border-radius:7px;
  background:linear-gradient(145deg,#fffefa,#eee5d5);
}

/* البطاقة داخل الظرف */

.inside-card{
  position:absolute;
  width:84%;
  height:80%;
  left:8%;
  top:10%;
  background:#fffdf8;
  border:1px solid #d4b46b;
  z-index:2;
  transition:1.8s cubic-bezier(.2,.8,.2,1);
}

/* طيات الظرف */

.left{
  position:absolute;
  left:0;
  bottom:0;
  width:0;
  height:0;
  border-style:solid;
  border-width:170px 260px 0 0;
  border-color:#f1e9dc transparent transparent transparent;
  z-index:5;
}

.right{
  position:absolute;
  right:0;
  bottom:0;
  width:0;
  height:0;
  border-style:solid;
  border-width:170px 0 0 260px;
  border-color:#e9dfce transparent transparent transparent;
  z-index:5;
}

.bottom{
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:58%;
  background:#eee5d7;
  clip-path:polygon(0 100%,50% 0,100% 100%);
  z-index:6;
}

/* الغطاء */

.flap{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:190px;
  background:linear-gradient(160deg,#fffefa,#e8dfcf);
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top;
  transition:1.7s cubic-bezier(.65,.05,.36,1);
  z-index:10;
}

.envelope.open .flap{
  transform:rotateX(180deg);
}

.envelope.open .inside-card{
  transform:translateY(-115px);
}

/* الختم */

.seal{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:90px;
  height:90px;
  border-radius:50%;
  z-index:20;

  display:flex;
  align-items:center;
  justify-content:center;

  color:white;
  font-family:"Cormorant Garamond",serif;
  font-size:28px;

  background:
    radial-gradient(circle at 30% 25%,
    #f5df9b,
    #c49a4c 50%,
    #8c672b);

  box-shadow:
    0 8px 25px rgba(80,55,15,.35),
    inset 0 0 0 2px #ffffff55;

  transition:1s;
}

.seal:after{
  content:"";
  position:absolute;
  inset:-8px;
  border-radius:50%;
  border:1px solid #c49b5066;
}

.envelope.open .seal{
  opacity:0;
  transform:translate(-50%,-50%) scale(.2) rotate(30deg);
}

.hint{
  position:absolute;
  bottom:-65px;
  width:100%;
  text-align:center;
  font-family:"Cormorant Garamond",serif;
  letter-spacing:4px;
  font-size:14px;
  color:#92723c;
}

/* الدعوة */

.invitation{
  position:fixed;
  left:50%;
  top:50%;

  width:min(91vw,470px);
  min-height:650px;

  transform:translate(-50%,100%) scale(.9);
  opacity:0;

  background:#fffdf8;
  border:1px solid #c9a55d;

  box-shadow:
    0 35px 100px rgba(60,45,20,.25),
    inset 0 0 0 7px rgba(200,165,95,.08);

  text-align:center;

  padding:55px 30px;

  z-index:50;

  transition:
    transform 2s cubic-bezier(.16,1,.3,1),
    opacity 1.5s;
}

.invitation.show{
  transform:translate(-50%,-50%) scale(1);
  opacity:1;
}

.invitation:before{
  content:"";
  position:absolute;
  inset:15px;
  border:1px solid #c9a55d88;
}

.invitation:after{
  content:"";
  position:absolute;
  inset:22px;
  border:1px solid #c9a55d33;
}

/* النص */

.crown{
  font-size:30px;
  color:#b58b3f;
}

.subtitle{
  font-family:"Cormorant Garamond",serif;
  font-size:13px;
  letter-spacing:7px;
  margin-top:8px;
}

.names{
  direction:ltr;
  font-family:"Playfair Display",serif;
  font-size:64px;
  line-height:.9;
  color:#896833;
  margin:25px 0;
}

.names span{
  display:block;
}

.amp{
  font-family:"Cormorant Garamond",serif;
  font-size:29px;
  color:#c29a4e;
  margin:12px;
}

.line{
  width:100px;
  height:1px;
  margin:22px auto;
  background:linear-gradient(
    90deg,
    transparent,
    #c9a55d,
    transparent
  );
}

.text{
  font-family:Arial,sans-serif;
  font-size:12px;
  line-height:2.3;
  color:#75654a;
}

.date{
  font-family:"Cormorant Garamond",serif;
  direction:ltr;
  font-size:31px;
  letter-spacing:4px;
  color:#876832;
  margin:15px 0 4px;
}

.time{
  font-family:"Cormorant Garamond",serif;
  font-size:17px;
  letter-spacing:2px;
}

.location{
  margin-top:18px;
  font-family:Arial,sans-serif;
  font-size:12px;
  line-height:2;
}

.children{
  font-family:Arial,sans-serif;
  font-size:11px;
  color:#947744;
}

/* العد التنازلي */

.countdown{
  display:flex;
  justify-content:center;
  gap:8px;
  direction:ltr;
  margin-top:22px;
}

.box{
  width:60px;
  padding:8px 3px;
  border:1px solid #c9a55d77;
}

.box b{
  display:block;
  font-family:"Cormorant Garamond",serif;
  font-size:24px;
  font-weight:500;
}

.box span{
  font-family:"Cormorant Garamond",serif;
  font-size:8px;
  letter-spacing:1px;
}

/* زر الموسيقى */

.music{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:200;

  border:1px solid #c9a55d;
  background:#fffdf8;

  color:#806333;

  padding:9px 22px;
  border-radius:30px;

  font-family:Arial,sans-serif;
}
</style>
</head>

<body>

<div class="star"></div>
<div class="star"></div>
<div class="star"></div>
<div class="star"></div>

<!-- الظرف -->

<div class="opening" id="opening">

  <div class="envelope" id="envelope">

    <div class="env"></div>

    <div class="inside-card"></div>

    <div class="left"></div>
    <div class="right"></div>
    <div class="bottom"></div>

    <div class="flap"></div>

    <div class="seal">
      A &amp; A
    </div>

    <div class="hint">
      اضغط لفتح الدعوة
    </div>

  </div>

</div>


<!-- الدعوة -->

<div class="invitation" id="invitation">

  <div class="crown">♕</div>

  <div class="subtitle">
    WEDDING INVITATION
  </div>

  <div class="names">

    <span>ALI</span>

    <div class="amp">&amp;</div>

    <span>AISHA</span>

  </div>

  <div class="line"></div>

  <div class="text">
    بكل حب وفرح<br>
    نتشرف بدعوتكم لمشاركتنا<br>
    أجمل لحظات العمر
  </div>

  <div class="date">
    02 · 12 · 2026
  </div>

  <div class="time">
    5:00 PM
  </div>

  <div class="location">
    قاعة كلكامش<br>
    فندق بابل
  </div>

  <div class="line"></div>

  <div class="children">
    جَنّةُ الأطفالِ مَنازِلُهم
  </div>

  <div class="countdown">

    <div class="box">
      <b id="days">00</b>
      <span>DAYS</span>
    </div>

    <div class="box">
      <b id="hours">00</b>
      <span>HOURS</span>
    </div>

    <div class="box">
      <b id="minutes">00</b>
      <span>MINUTES</span>
    </div>

    <div class="box">
      <b id="seconds">00</b>
      <span>SECONDS</span>
    </div>

  </div>

</div>


<!-- الأغنية -->

<audio id="music" loop>
  <source src="swan-dance.mp3" type="audio/mpeg">
</audio>

<button class="music" id="musicBtn">
  ♫ تشغيل الموسيقى
</button>


<script>

const opening =
document.getElementById("opening");

const envelope =
document.getElementById("envelope");

const invitation =
document.getElementById("invitation");

const music =
document.getElementById("music");

let opened=false;


/* فتح الظرف */

opening.addEventListener("click",()=>{

  if(opened) return;

  opened=true;

  envelope.classList.add("open");

  music.play().catch(()=>{});

  setTimeout(()=>{
    invitation.classList.add("show");
  },1000);

  setTimeout(()=>{
    opening.classList.add("hide");
  },2800);

});


/* الموسيقى */

document.getElementById("musicBtn")
.addEventListener("click",function(){

  if(music.paused){

    music.play();

    this.innerHTML="♫ إيقاف الموسيقى";

  }else{

    music.pause();

    this.innerHTML="♫ تشغيل الموسيقى";

  }

});


/* العد التنازلي */

function countdown(){

  const wedding =
  new Date("2026-12-02T17:00:00").getTime();

  const now=Date.now();

  let distance=wedding-now;

  if(distance<0) distance=0;

  const days=
  Math.floor(distance/86400000);

  const hours=
  Math.floor(
    distance%86400000/3600000
  );

  const minutes=
  Math.floor(
    distance%3600000/60000
  );

  const seconds=
  Math.floor(
    distance%60000/1000
  );

  document.getElementById("days")
  .textContent=
  String(days).padStart(2,"0");

  document.getElementById("hours")
  .textContent=
  String(hours).padStart(2,"0");

  document.getElementById("minutes")
  .textContent=
  String(minutes).padStart(2,"0");

  document.getElementById("seconds")
  .textContent=
  String(seconds).padStart(2,"0");

}

countdown();

setInterval(countdown,1000);

</script>

</body>
</html>
