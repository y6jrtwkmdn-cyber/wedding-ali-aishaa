<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ali & Aisha | Wedding Invitation</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#eee1d5;
  font-family:Georgia,"Times New Roman",serif;
}

/* ===== الظرف ===== */

#intro{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at center,
    #fffdf9 0%,
    #f5e9df 55%,
    #dfcdbb 100%);
  transition:1.5s ease;
}

#intro.hide{
  opacity:0;
  visibility:hidden;
}

.envelope{
  width:330px;
  height:225px;
  position:relative;
  cursor:pointer;
  perspective:1000px;
}

.env-body{
  position:absolute;
  inset:0;
  border-radius:6px;
  background:linear-gradient(145deg,#fffdf9,#ead9c9);
  box-shadow:
    0 30px 80px rgba(80,55,35,.25),
    inset 0 0 0 1px rgba(170,125,65,.35);
}

.env-body:after{
  content:"";
  position:absolute;
  inset:13px;
  border:1px solid rgba(170,125,65,.4);
}

.flap{
  position:absolute;
  z-index:3;
  top:0;
  left:0;
  width:0;
  height:0;

  border-left:165px solid transparent;
  border-right:165px solid transparent;
  border-top:125px solid #e3cfbd;

  transform-origin:top;
  transition:1.35s cubic-bezier(.2,.8,.2,1);
}

.envelope.open .flap{
  transform:rotateX(180deg);
}

.seal{
  position:absolute;
  z-index:5;
  left:50%;
  top:53%;

  transform:translate(-50%,-50%);

  width:70px;
  height:70px;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:white;

  background:
    linear-gradient(145deg,#e3c27c,#9d7138);

  font-size:22px;

  box-shadow:
    0 12px 30px rgba(80,50,20,.3);

  transition:.7s;
}

.envelope.open .seal{
  opacity:0;
  transform:translate(-50%,-50%) scale(.2);
}

.open-text{
  position:absolute;
  top:calc(50% + 155px);
  left:50%;

  transform:translateX(-50%);

  color:#96703d;
  font-size:15px;
  letter-spacing:4px;
  white-space:nowrap;

  animation:pulse 2s infinite;
}

@keyframes pulse{
  50%{
    opacity:.4;
  }
}


/* ===== الدعوة ===== */

#page{
  position:fixed;
  inset:0;

  overflow:auto;

  opacity:0;
  transform:scale(1.04);

  transition:1.7s ease;

  background:#eaded3;
}

#page.show{
  opacity:1;
  transform:scale(1);
}

.card{
  width:100%;
  min-height:100vh;

  position:relative;

  overflow:hidden;

  display:flex;
  justify-content:center;
}

.card img{
  width:100%;
  min-height:100vh;

  object-fit:cover;
  object-position:center;

  display:block;

  animation:zoom 15s ease-in-out infinite alternate;
}

@keyframes zoom{
  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.04);
  }
}


/* ===== لمعة ذهبية ===== */

.light{
  position:absolute;

  width:250px;
  height:250px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,220,150,.22),
      transparent 70%
    );

  filter:blur(10px);

  pointer-events:none;

  animation:moveLight 8s infinite alternate ease-in-out;
}

.light.one{
  top:15%;
  left:-100px;
}

.light.two{
  bottom:10%;
  right:-100px;

  animation-delay:2s;
}

@keyframes moveLight{
  from{
    transform:translate(0,0);
  }

  to{
    transform:translate(70px,-30px);
  }
}


/* ===== لمعات صغيرة ===== */

.sparkles{
  position:absolute;
  inset:0;

  pointer-events:none;
}

.spark{
  position:absolute;

  width:4px;
  height:4px;

  border-radius:50%;

  background:#fff8dc;

  box-shadow:
    0 0 8px white,
    0 0 18px rgba(255,210,130,.8);

  animation:sparkle 4s infinite ease-in-out;
}

.spark:nth-child(1){
  left:12%;
  top:25%;
}

.spark:nth-child(2){
  left:23%;
  top:43%;
  animation-delay:1s;
}

.spark:nth-child(3){
  left:80%;
  top:28%;
  animation-delay:2s;
}

.spark:nth-child(4){
  left:88%;
  top:52%;
  animation-delay:1.5s;
}

.spark:nth-child(5){
  left:15%;
  top:68%;
  animation-delay:2.5s;
}

.spark:nth-child(6){
  left:74%;
  top:65%;
  animation-delay:.7s;
}

@keyframes sparkle{

  0%,100%{
    opacity:0;
    transform:scale(.4) translateY(10px);
  }

  50%{
    opacity:1;
    transform:scale(1.8) translateY(-15px);
  }
}


/* ===== موبايل ===== */

@media(max-width:600px){

  .envelope{
    width:290px;
    height:200px;
  }

  .flap{
    border-left-width:145px;
    border-right-width:145px;
    border-top-width:110px;
  }

  .card img{
    object-position:center;
  }
}
</style>
</head>

<body>


<!-- =========================
     الظرف
========================= -->

<div id="intro">

  <div class="envelope" id="envelope">

    <div class="env-body"></div>

    <div class="flap"></div>

    <div class="seal">
      A & A
    </div>

  </div>

  <div class="open-text">
    OPEN INVITATION
  </div>

</div>


<!-- =========================
     الدعوة
========================= -->

<div id="page">

  <div class="card">

    <img
      src="invitation.png"
      alt="Ali & Aisha Wedding Invitation"
    >

    <div class="light one"></div>
    <div class="light two"></div>

    <div class="sparkles">

      <span class="spark"></span>
      <span class="spark"></span>
      <span class="spark"></span>
      <span class="spark"></span>
      <span class="spark"></span>
      <span class="spark"></span>

    </div>

  </div>

</div>


<script>

const envelope =
  document.getElementById("envelope");

const intro =
  document.getElementById("intro");

const page =
  document.getElementById("page");


envelope.addEventListener("click",function(){

  envelope.classList.add("open");

  setTimeout(function(){

    intro.classList.add("hide");

    page.classList.add("show");

    document.body.style.overflow="auto";

  },1350);

});

</script>

</body>
</html>
